name: A-Quant Smoke Test

concurrency:
  group: aquant-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q .
      - name: Import core modules
        run: |
          python - <<'PY'
          from aquant.data.service import MarketDataService
          from aquant.data.reference import ReferenceStore
          from aquant.data.context_service import MarketContextService
          from aquant.data.factor_service import AdjustmentFactorService
          from aquant.data.universe_service import HistoricalUniverseService
          from aquant.risk.trading_rules import price_limit_rule
          from aquant.runtime.resources import current_profile
          MarketDataService()
          ReferenceStore()
          MarketContextService()
          AdjustmentFactorService()
          HistoricalUniverseService()
          print(price_limit_rule("600000", "2026-09-25"))
          print(current_profile())
          print("core imports ok")
          PY
      - name: Offline data layer smoke test
        run: PYTHONPATH=. python tests/smoke_data_offline.py
      - name: Offline universe and trading rules smoke test
        run: PYTHONPATH=. python tests/smoke_universe_rules_offline.py
      - name: Offline pipeline smoke test
        run: PYTHONPATH=. python tests/smoke_pipeline_offline.py
      - name: Live free-data probe
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 4
        run: python diagnose.py
